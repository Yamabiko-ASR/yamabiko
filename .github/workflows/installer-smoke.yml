# Yamabiko -- installer smoke CI (release gate, heavyweight).
#
# Builds the real PyInstaller bundle + NSIS installer, installs it, and
# launches it. This catches the class of regressions that pass in a dev
# venv but fail in the frozen windowed-exe environment: invisible to the
# unit suite, surfaced only by the real build + install path. It runs at
# release-gate boundaries so the check is automatic rather than a manual
# rebuild per release.
#
# Runs on:
#   * PRs targeting `main` -- release-cut gate (dev -> main merges).
#   * Pushes to `main` -- post-merge verification.
#   * Tags matching `v*` -- release artifact build.
#   * Weekly (Mon 03:00 UTC) -- catches transitive-dep drift that a
#     gated PR wouldn't see (pip wheels republished upstream, etc.).
#   * Manual dispatch.
#
# NOT run on:
#   * PRs / pushes to `dev`. Daily dev work hits the lightweight
#     `ci.yml` workflow (unit + real-tier, ~10 min). Installer-smoke
#     is ~45 min and would burn the project's free-minute budget on
#     every iteration. The dev -> main merge is where installer-smoke
#     gates.
#
# What this CANNOT catch:
#   * Any bug whose symptom requires a GPU (ASR init past warmup,
#     ctranslate2 compute kernels).
#   * Any bug requiring llama-server running (translator sanity check,
#     full pipeline.ready sentinel).
#   * Any bug requiring a real WASAPI loopback device (audio capture,
#     the full default-launch E2E).
#
# These still live on the manual wizard E2E step in docs/RELEASE.md,
# which runs on the maintainer's dev box. The goal of this workflow
# is to catch the REMAINING bug class -- import graph + bundle layout
# + installer wiring -- at release-cut time so the release-prep E2E
# doesn't find them for the first time.

name: installer-smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  # Weekly Monday at 03:00 UTC -- catches transitive-dep drift (pip
  # wheels republished upstream) that a gated PR wouldn't see. Was
  # nightly; dropped to weekly 2026-04-24 to conserve free minutes
  # now that daily dev work runs on the lightweight ci.yml workflow.
  schedule:
    - cron: '0 3 * * 1'
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Cancel in-progress runs for the same branch / PR when a new commit
# lands. Saves Windows-runner minutes (pricey) and gives faster
# feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: build + smoke only reads the repo; artifacts
# upload via the actions service, not the repo token.
permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  # -------------------------------------------------------------------
  # Installer smoke
  #
  # Every step after "Build installer" runs against the REAL
  # PyInstaller + NSIS output, not the dev venv. The bundle tests plus
  # the installed-exe smoke catch the class of bug that only manifests
  # in the frozen bundle (missing DLLs, broken import graph, bundle
  # layout) and never in a dev venv.
  # -------------------------------------------------------------------
  installer-smoke:
    name: Installer smoke (build + install + launch + uninstall)
    runs-on: windows-latest
    # The build step alone is 35-40 min on windows-latest (the bundle
    # carries hf_xet plus the cuBLAS/cuDNN runtime DLLs). The smoke step
    # then runs three full LZMA extractions (initial install, a
    # reinstall, and a negative-control reinstall) plus several
    # fast-abort blocked attempts, so it costs minutes, not seconds.
    # 75m keeps headroom; if build time keeps creeping up, optimize the
    # spec (exclude unused hiddenimports) rather than raising again.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            yamabiko/requirements.txt
            pyproject.toml

      - name: Create release build venv (.venv)
        # installer/build.ps1 builds FROM .venv\Scripts\python.exe and fails
        # unless that venv's `pip freeze` matches constraints-release.txt
        # exactly, so CI builds in the same kind of venv as a release box.
        # Prepending its Scripts dir makes python/pip/pytest in every later
        # step resolve to the venv, never the bare setup-python interpreter.
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path .venv\Scripts).Path | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install project + PyInstaller into .venv
        # pwsh multi-line run blocks only propagate the LAST command's
        # $LASTEXITCODE, so a failed intermediate pip install would be
        # masked by a succeeding later one. Guard each native command
        # (same idiom as installer/build.ps1).
        run: |
          # Release path: exactly the release-venv prereqs from the
          # installer/build.ps1 header (and constraints-release.txt's own
          # header), version-locked so the build.ps1 lock-drift gate sees the
          # locked set and nothing else. No pip self-upgrade: pip is outside
          # the lock and the documented setup does not do one.
          # requirements-dev.txt -r-includes yamabiko/requirements.txt and adds
          # the release-gate tooling (pytest*, pefile, psutil); pyinstaller is
          # pinned by the same constraints file.
          python -m pip install -r requirements-dev.txt -c constraints-release.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e . -c constraints-release.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "pyinstaller>=6.10" -c constraints-release.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # NSIS: chocolatey install is 30-60s, cache between runs.
      # The NSIS version is pinned to the release box's makensis, and the
      # cache key carries it so a cache built from another version is never
      # reused.
      - name: Cache NSIS
        id: nsis-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: ${{ runner.os }}-nsis-3.12.0

      - name: Install NSIS (Unicode)
        if: steps.nsis-cache.outputs.cache-hit != 'true'
        run: choco install nsis --version 3.12.0 --no-progress -y

      - name: Verify makensis on PATH
        run: |
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path (Join-Path $nsisDir "makensis.exe"))) {
            throw "makensis.exe not found at $nsisDir"
          }
          # Expose the dir on PATH for subsequent steps.
          echo $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Append
          # Sanity: expect Unicode build (the installer script relies
          # on MUI2 Unicode, not Ansi). Newer Chocolatey packages ship
          # Unicode by default; older ones ship Ansi. Verify.
          # NOTE: test the Select-String RESULT, not $LASTEXITCODE --
          # after a pipeline, $LASTEXITCODE is makensis's exit code, so
          # the old check passed even for an Ansi build.
          $unicode = & (Join-Path $nsisDir "makensis.exe") /HDRINFO |
            Select-String "NSIS_UNICODE"
          if (-not $unicode) {
            throw "NSIS build lacks Unicode support (no NSIS_UNICODE in /HDRINFO). Update the chocolatey install or cache key."
          }

      - name: Stub vendored llama-server binaries
        # llama-server.exe + CUDA DLLs are ~200 MB and not in the
        # yamabiko repo; build.ps1 fails without them. Stubs have
        # the right filenames and a fixed text marker as content --
        # the installer bundle-layout tests check PRESENCE, not
        # load-ability.
        # Tests that actually need llama-server to run (full E2E)
        # live in test_real_frozen_e2e.py and self-skip when the
        # port isn't reachable.
        run: .\installer\ci-prepare-vendor-stubs.ps1

      - name: Build installer
        # YAMABIKO_ALLOW_STUB_LLAMA: this CI build runs on the text stubs
        # created above, which assert-llama-vendor.ps1 would otherwise
        # reject as non-PE content and whose PE imports the provenance and
        # license-closure audits cannot parse. The audits exempt only files
        # whose bytes are exactly the stub marker, so a corrupt real binary
        # still fails here. Local/release builds never set this, so a
        # leaked stub fails the build there.
        env:
          YAMABIKO_ALLOW_STUB_LLAMA: '1'
        run: .\installer\build.ps1

      - name: Show installer size
        run: |
          $installer = Get-ChildItem "installer\yamabiko-*-setup.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "No installer produced by build.ps1"
          }
          $mb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.Name) ($mb MB)"
          # Upper bound: the real-vendor build is ~1.5 GB. CI build
          # with stub llama is ~900 MB-1.2 GB. Flag a 5 GB upper
          # bound to catch accidental inclusion of HF models.
          if ($installer.Length -gt 5GB) {
            throw "Installer exceeds 5 GB -- HF models may be leaking into the bundle"
          }

      # The frozen-bundle tests live at tests/test_real_frozen_bundle.py.
      # Companion checks may self-skip when their optional runtime surface is
      # unavailable. The frozen_artifact subset is different: it is a
      # non-skippable release gate and must run only after this job built the
      # exact dist/yamabiko candidate under test.
      - name: Run frozen-bundle companion tests against dist/yamabiko
        run: pytest tests/test_real_frozen_bundle.py -m "real and not frozen_artifact" -v --timeout=60

      - name: Run mandatory frozen-artifact gate with zero skips
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          pytest tests/test_real_frozen_bundle.py -m frozen_artifact -v --timeout=60 --junitxml=build/frozen-artifact-gate.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$result = Get-Content -LiteralPath build/frozen-artifact-gate.xml
          $skipped = @($result.SelectNodes("//testcase/skipped")).Count
          if ($skipped -ne 0) {
            throw "frozen_artifact gate skipped $skipped test(s); every built-candidate gate is mandatory"
          }

      - name: Silent install + launch + uninstall cycle
        run: .\installer\ci-smoke.ps1

      # -----------------------------------------------------------------
      # Failure diagnostics: upload everything a human would want.
      # -----------------------------------------------------------------

      # The expression-context `env.LOCALAPPDATA` is EMPTY (runner env
      # vars aren't in the workflow `env` context), so the upload below
      # used to silently grab nothing. Copy via a shell
      # step -- where $env:LOCALAPPDATA does resolve -- and upload
      # from runner.temp, which IS a valid expression.
      - name: Collect app logs (on failure)
        if: failure()
        run: |
          $src = Join-Path $env:LOCALAPPDATA "Yamabiko\logs"
          $dst = Join-Path $env:RUNNER_TEMP "yamabiko-logs"
          if (Test-Path $src) {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item (Join-Path $src "*.log") $dst -ErrorAction SilentlyContinue
            Get-ChildItem $dst | Format-Table Name, Length
          } else {
            Write-Host "no log dir at $src"
          }

      # Per-process role logs: main-watchdog.log, main-pipeline.log,
      # main-overlay.log. The *.log glob below captures all of them.
      - name: Upload runtime logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Logs are per-process (main-watchdog.log, main-pipeline.log,
          # main-overlay.log); the glob below captures all of them.
          name: yamabiko-runtime-logs
          path: ${{ runner.temp }}\yamabiko-logs\*.log
          if-no-files-found: ignore

      - name: List installed dir (on failure)
        if: failure()
        run: |
          $dir = "$env:TEMP\yamabiko-ci-smoke"
          if (Test-Path $dir) {
            Write-Host "=== Contents of $dir ==="
            Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize
          } else {
            Write-Host "=== $dir does not exist ==="
          }

      - name: Upload built installer (on failure)
        # Size gate: a few hundred MB is fine; GitHub's artifact
        # limit is 10 GB per upload, we're well under.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yamabiko-installer
          path: installer\yamabiko-*-setup.exe
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload dist/ bundle tree listing (on failure)
        # The FULL dist/ tree is too big to upload. But its file list
        # is often the key to diagnosing "expected file not in bundle"
        # regressions -- much cheaper than the bundle itself.
        if: failure()
        run: |
          $dist = "dist\yamabiko"
          if (Test-Path $dist) {
            Get-ChildItem $dist -Recurse |
              Select-Object FullName, Length |
              ConvertTo-Json -Depth 2 |
              Out-File -FilePath "dist-listing.json" -Encoding UTF8
          }

      - name: Upload dist/ listing artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-listing
          path: dist-listing.json
          if-no-files-found: ignore

      # IMPORTANT: every installer this workflow produces is built with
      # STUBBED llama binaries (ci-prepare-vendor-stubs runs before
      # build.ps1 on every trigger, tags included). The translator in
      # these artifacts is a 27-byte text file -- they install, launch
      # --version, and uninstall, but cannot actually translate. They
      # exist only for post-merge / smoke bisection. The shippable release
      # installer MUST be built locally with the real vendored binaries
      # per docs/RELEASE.md. The artifact names below shout this so nobody
      # attaches a CI artifact to a GitHub release.
      - name: Upload smoke-only installer (main push, bisection aid)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SMOKE-ONLY-stub-llama-DO-NOT-SHIP-${{ github.sha }}
          path: installer\yamabiko-*-setup.exe
          retention-days: 14

      - name: Upload smoke-only installer (tag build, bisection aid)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SMOKE-ONLY-stub-llama-DO-NOT-SHIP-${{ github.ref_name }}
          path: installer\yamabiko-*-setup.exe
          retention-days: 14

  # -------------------------------------------------------------------
  # Weekly dependency CVE audit. Rides the same weekly schedule as the
  # dep-drift smoke; skipped on PR/push triggers so a fresh upstream
  # CVE disclosure can never block a release-cut PR (it surfaces in
  # the Monday run instead). Audits the release lock: installers are
  # built against constraints-release.txt pins, so auditing the
  # requirements RANGES (which pip-audit resolves to the NEWEST
  # satisfying versions) would stay green while a CVE against a pinned
  # version ships. The lock is a full build-venv freeze, so it is a
  # SUPERSET of the shipped set -- dev tooling that never ships gets
  # audited too; that errs conservative (extra findings possible,
  # shipped pins never missed). pip-audit has no constraints support;
  # the lock is a fully-pinned pip-freeze file, so `--no-deps -r`
  # audits exactly its pins, and `--disable-pip` (only valid with
  # --no-deps or hashes) skips pip's resolution entirely -- which
  # also makes the audit platform-independent (no need to resolve the
  # Windows-only PyAudioWPatch wheel). PYTHONUTF8: pip-audit's requirements parser
  # dies on non-ASCII comments under cp932 (same gotcha as
  # OVERVIEW.md's console-codepage note).
  # -------------------------------------------------------------------
  dep-audit:
    name: pip-audit (weekly)
    runs-on: windows-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Audit release-locked dependencies for known CVEs
        env:
          PYTHONUTF8: '1'
        run: |
          pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Waived: three setuptools advisories in code the app never runs.
          # PYSEC-2025-49 is a path traversal in PackageIndex downloads and
          # PYSEC-2026-3447 an sdist MANIFEST.in exclusion bypass on macOS.
          # GHSA-xmj3-9gf7-h52w is a Windows path escape through
          # namespace_packages.txt in the legacy wheel-as-egg install path
          # (Wheel.install_as_egg), which neither the app nor the build runs.
          # The frozen bundle carries only pkg_resources, not setuptools'
          # package_index or sdist code, and the build venv never downloads
          # through PackageIndex. setuptools stays in the lock because
          # PyInstaller and pyinstaller-hooks-contrib require it, and at
          # 70.2.0 because newer releases drop pkg_resources.
          pip-audit --disable-pip --no-deps -r constraints-release.txt --ignore-vuln PYSEC-2025-49 --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w
