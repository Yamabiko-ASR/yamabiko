# Yamabiko -- lightweight CI (unit + real-tier).
#
# Runs on every PR + push for BOTH `dev` and `main` branches. This
# is the fast signal developers expect on every change; keep it
# under ~10 min total.
#
# The heavy `installer-smoke` workflow runs only on release-gate
# paths (PRs / pushes to main, `v*` tags, weekly dep-drift catch).
# See .github/workflows/installer-smoke.yml for the workflow comment
# explaining why the split exists.

name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Cancel in-progress runs for the same branch / PR when a new commit
# lands. Saves Windows-runner minutes (pricey) and gives faster
# feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: these jobs only read the repo.
permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  # -------------------------------------------------------------------
  # Unit tests (pytest -m "not real")
  #
  # Platform-agnostic unit coverage: the cheapest signal that nothing
  # in the composition layer regressed.
  # -------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            yamabiko/requirements.txt
            pyproject.toml

      - name: Install project + test deps
        # pwsh multi-line run blocks only propagate the LAST command's
        # $LASTEXITCODE, so a failed intermediate pip install would be
        # masked by a succeeding later one. Guard each native command
        # (same idiom as installer/build.ps1).
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # requirements-dev.txt -r-includes yamabiko/requirements.txt, so
          # this single install covers the runtime deps AND the test tooling
          # (pytest*, pefile, psutil) that used to be ad-hoc pip-installed
          # here. Ranges only: the release lock (constraints-release.txt) is
          # applied on the installer-smoke path, NOT here, so a routine
          # contributor dep bump isn't blocked by a stale lock.
          pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Editable install so `import yamabiko` resolves to the repo
          # copy (needed by pytest + unit tests that patch on the
          # module by path).
          pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit suite
        # HF_HUB_OFFLINE is a tripwire, not an optimisation: the unit tier
        # must never reach the HF network. Twice on 2026-07-11 a test that
        # drove the settings Apply path on this cache-less runner walked into
        # a REAL 5.14 GiB GGUF download inside this job (the stranded-install
        # heal probes the cache on every Apply). Offline mode turns any
        # future leak of that class into an immediate, named failure instead
        # of a silent multi-gigabyte download that flakes on the 60 s timeout.
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -m "not real" -q --timeout=60

  # -------------------------------------------------------------------
  # Lightweight real-tier tests. Built-candidate gates run only after the
  # installer-smoke workflow creates dist/yamabiko.
  #
  # Most real-tier tests self-skip when their prerequisites aren't
  # present (no llama-server, no GPU, no WASAPI loopback). What DOES
  # run on a GitHub-hosted Windows runner:
  #   * onnxruntime CPU Silero VAD session
  #   * PyAudioWPatch import (no device required for the import path)
  #   * HuggingFace signature checks (hits HF HEAD endpoints)
  #   * test_real_watchdog_subprocess.py (spawns a trivial cmd)
  #
  # This job ensures that layer stays green on every PR, independent
  # of the heavier installer-smoke job.
  # -------------------------------------------------------------------
  real-tier-tests:
    name: Real-tier (CI-subset)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            yamabiko/requirements.txt
            pyproject.toml

      - name: Install project + test deps
        # Guard each native command: a pwsh run block only propagates
        # the LAST $LASTEXITCODE (see the unit-tests job note).
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # requirements-dev.txt -r-includes yamabiko/requirements.txt (runtime
          # deps + test tooling). Ranges only -- constraints-release.txt is a
          # release-path lock, deliberately not applied on this light CI loop.
          pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run lightweight real-tier suite (skips handle GPU/llama/audio absence)
        # test_real_show_in_folder.py needs a desktop that shows Explorer's
        # selection: on this runner the window opens on the folder but its
        # selection stays empty. It runs in the real-gui release phase
        # (scripts/release-gates.json) instead.
        run: pytest -m "real and not frozen_artifact" -v --timeout=300 --ignore=tests/lifecycle/test_real_show_in_folder.py
