# Monthly, low-noise dependency update PRs. Target the dev branch
# (main is release-only).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/yamabiko"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
