[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; --strict-markers: an unregistered @pytest.mark.* is a collection error,
; not a silently-ignored typo (a misspelled `real` mark would otherwise
; drop a test out of the release gate with no signal). Plugin-provided
; marks (asyncio, timeout, qt_*) register themselves and stay valid.
addopts = -v --tb=short --strict-markers
pythonpath = .
asyncio_mode = auto
markers =
    real: hits real external dependencies (HF network, PyAudio hardware,
          GPU, subprocess). Markers select tiers EXPLICITLY: the default
          bare `pytest` run has no -m filter and includes everything;
          developers without hardware run `-m "not real"` for a green unit
          loop. Fresh/pre-build real runs use
          `-m "real and not frozen_artifact"`.
    frozen_artifact: non-skippable gate that requires an already-built frozen
          candidate under dist/yamabiko. It is also marked `real`; release and
          post-build CI select it explicitly only after building the candidate.
    frozen_external_llama: frozen E2E that requires an already reachable
          llama-server on port 8090.
    frozen_owned_llama: frozen E2E that owns its whole process chain: port
          8090 must be free because the frozen watchdog owns the llama-server
          process, or the test runs a role directly without a llama-server
          (the handle-less --run-main download) and so needs no external one.
    slow: tests that take >20s (typically frozen-bundle E2E). Subset of
          real; use `-m "real and not slow"` for the faster real-tier
          loop during dev.
