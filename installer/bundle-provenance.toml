schema_version = 1

[[component]]
id = "nvidia-cublas-cu12-sidecars"
name = "NVIDIA cuBLAS 12 runtime sidecars"
class = "nvidia-runtime"
priority = 300
globs = [
  "_internal/llama/cublas64_12.dll",
  "_internal/llama/cublasLt64_12.dll",
]
license_mode = "distribution"
license_source = "nvidia-cublas-cu12"

[[component]]
id = "nvidia-cuda-runtime-cu12-sidecar"
name = "NVIDIA CUDA 12 runtime sidecar"
class = "nvidia-runtime"
priority = 300
globs = ["_internal/llama/cudart64_12.dll"]
license_mode = "distribution"
license_source = "nvidia-cuda-nvrtc-cu12"

[[component]]
id = "microsoft-vc-runtime"
name = "Microsoft Visual C++ Runtime"
class = "vc-runtime"
priority = 200
globs = [
  "_internal/msvcp140*.dll",
  "_internal/vcruntime140*.dll",
  "_internal/vcomp140.dll",
  "_internal/llama/msvcp140*.dll",
  "_internal/llama/vcruntime140*.dll",
  "_internal/llama/vcomp140.dll",
]
license_mode = "reviewed-exception"
review_id = "VC-REDIST-EULA"
review_reason = "Microsoft Visual C++ runtime DLLs are redistributed under the Microsoft Visual C++ Redistributable terms; the reviewed terms do not require a separate license-text payload."

[[component]]
id = "llama-cpp"
name = "llama.cpp"
class = "vendored"
priority = 100
# Keep this synchronized with installer/llama-manifest.txt.  This is
# intentionally exact rather than a catchall: a new sidecar must acquire a
# reviewed owner instead of silently inheriting llama.cpp's MIT license.
globs = [
  "_internal/llama/LICENSE.txt",
  "_internal/llama/llama-server.exe",
  "_internal/llama/cublas64_12.dll",
  "_internal/llama/cublasLt64_12.dll",
  "_internal/llama/cudart64_12.dll",
  "_internal/llama/ggml-base.dll",
  "_internal/llama/ggml-cpu.dll",
  "_internal/llama/ggml-cuda.dll",
  "_internal/llama/ggml.dll",
  "_internal/llama/llama.dll",
  "_internal/llama/msvcp140.dll",
  "_internal/llama/mtmd.dll",
  "_internal/llama/vcomp140.dll",
  "_internal/llama/vcruntime140_1.dll",
  "_internal/llama/vcruntime140.dll",
]
license_mode = "bundle-file"
license_source = "_internal/llama/LICENSE.txt"

