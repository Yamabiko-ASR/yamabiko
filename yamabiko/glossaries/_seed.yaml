# Time-stable seed glossary — ships with the app, read-only.
#
# Priority order in GlossaryManager: user.yaml > genre.json > _seed.yaml.
# Any user-learned entry for the same surface overrides this file.
#
# Policy: entries here must be TIME-STABLE — place names, country exonyms,
# long-standing institutions, fixed cultural fixtures. NO current political
# figures, athletes, celebrities, or current-event names. Those rot fast
# and are better handled by the learning path (per-genre JSON).
#
# Romanization: Hepburn with macrons (BGN/PCGN 2024). Tōkyō not Tokyo.
# Readings: hiragana only, as with user.yaml.
