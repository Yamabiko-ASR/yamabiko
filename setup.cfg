# Yamabiko project-level setup.cfg.
#
# Holds the mutation-testing (mutmut) configuration. mutmut reads the
# [mutmut] section here by default; no other tooling depends on this
# file (packaging config lives in pyproject.toml and installer/).
#
# ASCII-only on purpose: configparser opens setup.cfg with the platform
# default codec (cp932 on Japanese Windows), so any non-ASCII character
# would raise UnicodeDecodeError.
#
# Mutations are scoped to the three process-composition modules
# (main.py, watchdog.py, overlay_app/__main__.py) -- the wiring layer,
# where mutation testing proves the unit tests can actually tell correct
# wiring from broken wiring. Running mutmut over the whole package would
# take hours; the composition modules are a fast, focused target.
#
# Configure runs in this section, not via mutmut CLI args: CLI quoting
# through nested shells is unreliable on Windows.

[mutmut]
paths_to_mutate=yamabiko/main.py,yamabiko/watchdog.py,yamabiko/overlay_app/__main__.py

# Targeted test runner: only the tests that cover the three
# composition modules. Running the full unit suite per mutation
# would be 12s x ~3000 mutations = 10 hours; the targeted subset
# is ~3s x mutations.
#
# tests/test_build_pipeline.py            -> build/run_pipeline + PipelineApp
# tests/test_build_watchdog.py            -> build_watchdog + WatchdogApp
# tests/overlay_app/test_build_overlay.py -> build_overlay + OverlayApp
# tests/test_main_entry.py                -> main() wiring
# tests/overlay_app/test_main_signal_connects.py -> overlay main() shell
# tests/test_watchdog.py                  -> Watchdog policy unit tests
# tests/test_health_probe.py              -> HealthProbe (watchdog.py) wedge detector
# Use the venv's python with Windows backslashes (cmd.exe passes the
# path to CreateProcess; forward slashes fail lookup). Also avoids
# the "python" on PATH resolving to a non-venv interpreter.
runner=.venv\Scripts\python.exe -m pytest tests/test_build_pipeline.py tests/test_build_watchdog.py tests/overlay_app/test_build_overlay.py tests/test_main_entry.py tests/overlay_app/test_main_signal_connects.py tests/test_watchdog.py tests/test_health_probe.py -x --timeout=30 -q

tests_dir=tests/
